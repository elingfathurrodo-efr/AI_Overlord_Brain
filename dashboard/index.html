<!DOCTYPE html>
<html>

<head>

<title>AI OVERLORD CONTROL CENTER</title>

<link rel="stylesheet" href="style.css">

<meta charset="UTF-8">

</head>

<body>

<h1>AI OVERLORD CONTROL CENTER</h1>

<div class="grid">

<div class="card">
<h2>Capital</h2>
<p id="capital">loading...</p>
</div>

<div class="card">
<h2>Equity</h2>
<p id="equity">loading...</p>
</div>

<div class="card">
<h2>Profit Today</h2>
<p id="profit_today">loading...</p>
</div>

<div class="card">
<h2>Active Strategy</h2>
<p id="strategy">loading...</p>
</div>

<div class="card">
<h2>Market Regime</h2>
<p id="market">loading...</p>
</div>

<div class="card">
<h2>AI Health</h2>
<p id="ai_health">loading...</p>
</div>

<div class="card">
<h2>Evolution Score</h2>
<p id="evolution_score">loading...</p>
</div>

<div class="card">
<h2>Mining Mode</h2>
<p id="mining_mode">loading...</p>
</div>

<div class="card">
<h2>Last Trade</h2>
<p id="last_trade">loading...</p>
</div>

</div>

<h2>AI Evolution Map</h2>

<canvas id="evolutionChart" width="800" height="300"></canvas>

<script src="dashboard.js"></script>

</body>
</html>
