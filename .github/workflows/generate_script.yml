name: Generate MT5 Script Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Full MQ5 File
        run: |
          # Perhatikan: Tidak ada spasi di dalam kurung kurawal variabel
          sed"s/TOKEN_AKAN_DIISI_OTOMATIS/${{secrets.MY_GITHUB_PAT}}/g"template_ea.mq5>AI_Overlord_Brain_V20.mq5
          sed-i"s|REPO_AKAN_DIISI_OTOMATIS|${{github.repository}}|g"AI_Overlord_Brain_V20.mq5
          
      - name: Commit Updated Script
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add AI_Overlord_Brain_V20.mq5
          git commit -m "GitHub melahirkan script MT5 baru [Automated]" || echo "No changes"
          git push
