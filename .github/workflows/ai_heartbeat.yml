name: AI Overlord Heartbeat

on:
  schedule:
    - cron: '*/10 * * * *' # 1️⃣ Menjalankan AI setiap 10 menit otomatis
  workflow_dispatch:      # 2️⃣ Memungkinkan kamu klik "Run" manual dari HP/Web

jobs:
  evolution_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Memberi izin AI untuk menulis ke logic.json

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Dependencies
        run: |
          pip install pandas numpy

      - name: 🧠 Running Brain Engine (50 Saraf)
        run: python engine/brain.py

      - name: 🧬 Committing Evolution to GitHub
        run: |
          git config --local user.email "ai-overlord-bot@github.com"
          git config --local user.name "AI-Overlord-Machine"
          git add logic.json genomes/genomes_active.json config/risk_protector.json
          git commit -m "🧬 Evolution Update: Neural Logic Synchronized [Skip CI]" || exit 0
          git push

