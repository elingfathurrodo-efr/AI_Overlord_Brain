name: AI Overlord Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MQ5
        run: |
          echo "Generating EA..."

          if [ ! -f template_ea.mq5 ]; then
            echo "// AI Overlord Brain V20 - Neural Update" > template_ea.mq5
            echo "// Token: TOKEN_AKAN_DIISI_OTOMATIS" >> template_ea.mq5
          fi

          sed "s|TOKEN_AKAN_DIISI_OTOMATIS|TEST_TOKEN|g" template_ea.mq5 > AI_Overlord_Brain_V20.mq5

          echo "File generated:"
          ls -la

      - name: Commit File
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add AI_Overlord_Brain_V20.mq5
          git commit -m "Generate EA file" || echo "No changes"

          git push
