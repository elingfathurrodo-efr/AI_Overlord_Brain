name: AI Overlord Builder
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # --- BARIS WAJIB DIBAWAH INI AGAR FILE MUNCUL LAGI ---
    permissions:
      contents: write
    # ----------------------------------------------------
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Neural Script
        run: |
          # Buat file baru jika sebelumnya sudah dihapus
          touch AI_Overlord_Brain_V20.mq5
          # Suntikkan token dan nama repo
          sed "s|TOKEN_AKAN_DIISI_OTOMATIS|${{ secrets.MY_GITHUB_PAT }}|g" template_ea.mq5 > AI_Overlord_Brain_V20.mq5
          sed -i "s|REPO_AKAN_DIISI_OTOMATIS|${{ github.repository }}|g" AI_Overlord_Brain_V20.mq5

      - name: Deploy to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
        run: |
          git config --global user.name 'AI-Overlord-Bot'
          git config --global user.email 'bot@ai-overlord.com'
          # Paksa add file yang baru dibuat
          git add AI_Overlord_Brain_V20.mq5
          git commit -m "🧬 AI Neural Update: Build V20 Success" || exit 0
          git push origin main
