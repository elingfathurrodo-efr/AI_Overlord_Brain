name: Generate MT5 Script Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Full MQ5 File
        run: |
          # Ganti token dan repository di template
          sed "s/TOKEN_AKAN_DIISI_OTOMATIS/${{secrets.MY_GITHUB_PAT}}/g" template_ea.mq5 > AI_Overlord_Brain_V20.mq5
          sed -i "s|REPO_AKAN_DIISI_OTOMATIS|${{github.repository}}|g" AI_Overlord_Brain_V20.mq5
          
      - name: Commit Updated Script
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add AI_Overlord_Brain_V20.mq5
          # Hanya commit jika ada perubahan
          if ! git diff --cached --quiet; then
            git commit -m "GitHub melahirkan script MT5 baru [Automated]"
            git push
          else
            echo "Tidak ada perubahan untuk di-commit"
          fi
