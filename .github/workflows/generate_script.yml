name: AI Overlord Builder & Neural Evolution

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set Up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 🧬 Run Strategy Generator
        run: |
          # Pastikan folder engine, formulas, dan genomes sudah ada
          python engine/strategy_generator.py || echo "⚠️ Python script skipped"

      - name: 🛠️ Build Final MQ5 Script
        run: |
          # Mengisi Token dan Repo secara otomatis ke file baru
          sed "s/TOKEN_AKAN_DIISI_OTOMATIS/${{ secrets.MY_GITHUB_PAT }}/g" template_ea.mq5 > AI_Overlord_Brain_V20.mq5
          sed -i "s|REPO_AKAN_DIISI_OTOMATIS|${{ github.repository }}|g" AI_Overlord_Brain_V20.mq5
          echo "✅ Final script generated successfully."

      - name: 🚀 Deploy Updates to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
        run: |
          git config --global user.name 'AI-Overlord-Bot'
          git config --global user.email 'bot@ai-overlord.com'
          
          # Menambahkan semua file hasil update
          git add AI_Overlord_Brain_V20.mq5 genomes/*.json index.json logic.json || true
          
          # Commit hanya jika ada perubahan
          git commit -m "🧬 AI Neural Update: v20.0 [Build Success]" || exit 0
          
          git push origin main
