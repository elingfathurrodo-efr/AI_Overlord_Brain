name: Generate MT5 Script
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Generate File
        run: |
          sed "s/TOKEN_AKAN_DIISI_OTOMATIS/${{secrets.MY_GITHUB_PAT}}/g" template_ea.mq5 > AI_Overlord_Brain_V20.mq5
          sed -i "s|REPO_AKAN_DIISI_OTOMATIS|${{github.repository}}|g" AI_Overlord_Brain_V20.mq5
      - name: Push File
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add AI_Overlord_Brain_V20.mq5
          git commit -m "Create final script" || exit 0
          git push

